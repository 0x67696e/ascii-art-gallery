<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Campfire · ASCII Art Gallery</title>
<link rel="stylesheet" href="../assets/piece.css">
</head>
<body>
<script src="../assets/ascii.js"></script>
<script>
/* A heat field: hot embers along the bottom; heat rises row by row, drifting sideways
   and cooling a random amount, which makes flickering tongues of flame. */
const RAMP = " .,:;-=+*#%@";
let heat, W, H;
Ascii.play({
  title: "Campfire",
  bg: "#060302",
  cols: 140, embedCols: 80,
  init(g) { W = g.cols; H = g.rows + 2; heat = new Float32Array(W * H); },
  frame(g, t) {
    const base = (H - 1) * W;
    for (let x = 0; x < W; x++) {
      const u = (x / (W - 1)) * 2 - 1;                     // -1..1 across the screen
      const bed = Math.max(0, 1 - Math.pow(Math.abs(u) / 0.62, 4));
      const flick = Math.random() < 0.25 ? 0.5 : 1;
      heat[base + x] = bed * flick * (0.85 + 0.15 * Math.sin(x * 0.21 + t * 3));
    }
    const wind = Math.sin(t * 0.7) * 0.6 + Math.sin(t * 1.9) * 0.25;
    const cool = 1.5 / H;
    // each cell rises one row, drifts sideways a little, and cools a random amount
    for (let y = 1; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const r = Math.random();
        const dx = Math.min(W - 1, Math.max(0, x - Math.round(r * 2 - 1 + wind * 0.4)));
        heat[(y - 1) * W + dx] = Math.max(0, heat[y * W + x] - r * cool * 1.4);
      }
    }
    for (let y = 0; y < g.rows; y++) {
      for (let x = 0; x < W; x++) {
        const row = y * W, xl = Math.max(0, x - 1), xr = Math.min(W - 1, x + 1);
        const below = y + 1 < H ? heat[row + W + x] : heat[row + x];
        const v = Math.min(1, (heat[row + xl] + 2 * heat[row + x] + heat[row + xr] + 2 * below) / 6 * 1.3);
        if (v < 0.05) continue;
        const k = RAMP.charCodeAt(Math.min(RAMP.length - 1, (v * RAMP.length) | 0));
        g.set(x, y, k, Math.min(1, v * 2.4), Math.max(0, Math.min(1, v * 2.2 - 0.75)), Math.max(0, v * 2.5 - 1.8));
      }
    }
  }
});
</script>
</body>
</html>
