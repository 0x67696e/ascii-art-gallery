<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plasma · ASCII Art Gallery</title>
<link rel="stylesheet" href="../assets/piece.css">
</head>
<body>
<script src="../assets/ascii.js"></script>
<script>
/* Four sine waves added together; the sum picks the character and the hue. */
const RAMP = " .:-=+*o#%@";
function hsv(h, s, v) {
  h = ((h % 1) + 1) % 1;
  const i = Math.floor(h * 6), f = h * 6 - i, p = v * (1 - s), q = v * (1 - f * s), u = v * (1 - (1 - f) * s);
  return [[v, u, p], [q, v, p], [p, v, u], [p, q, v], [u, p, v], [v, p, q]][i % 6];
}
Ascii.play({
  title: "Plasma",
  bg: "#04040a",
  cols: 150, embedCols: 90,
  frame(g, t) {
    const sc = 1 / 70;   // pixels -> wave units, so it looks the same on any screen
    const cx = g.W * sc * (0.5 + 0.3 * Math.sin(t * 0.31)), cy = g.H * sc * (0.5 + 0.3 * Math.cos(t * 0.23));
    for (let y = 0; y < g.rows; y++) {
      const Y = (y + 0.5) * g.ch * sc;
      for (let x = 0; x < g.cols; x++) {
        const X = (x + 0.5) * g.cw * sc;
        let v = Math.sin(X + t) + Math.sin(Y * 1.3 - t * 1.1) + Math.sin((X + Y) * 0.7 + t * 0.6)
              + Math.sin(Math.hypot(X - cx, Y - cy) * 1.6 - t * 1.8);
        v = (v + 4) / 8;
        const k = RAMP.charCodeAt(Math.min(RAMP.length - 1, (v * RAMP.length) | 0));
        if (k === 32) continue;
        const [r, gg, b] = hsv(v * 0.9 + t * 0.04, 0.75, 0.25 + 0.75 * v);
        g.set(x, y, k, r, gg, b);
      }
    }
  }
});
</script>
</body>
</html>
